[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vle-mcp"
version = "0.1.0"
description = "Educational MCP server for the vle thermodynamics library"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Miguel Jackson" }]
dependencies = [
  "anyio>=4.8,<5",
  "mcp>=1.27,<2",
  "pydantic>=2.10,<3",
  "starlette>=0.46,<1",
  "vle-thermo>=0.12.1,<0.13",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.11,<1",
]

[project.scripts]
vle-mcp = "vle_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vle_mcp"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
